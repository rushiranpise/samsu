plugins {
    id 'com.android.application'
}

/*
 * Where the helper and oracle come from.
 *
 * The committed prebuilts, which are the binaries upstream validated on
 * hardware, so an ordinary build needs no NDK. -PnativeFromSource=true builds
 * them from exploit/ instead - and that is an override to reach for knowingly:
 * the engine calls the helper with four arguments
 * (--run-payload <payload> <root-helper> <log>), while exploit/src/su_daemon.c
 * accepts three and exits 2 on the fourth. A from-source helper shipped once and
 * failed every root run before the kernel was touched.
 *
 * The three per-model payloads are compiled by android/build-payloads.sh from the
 * Root My Galaxy Payloads source; -PpayloadDir packages those builds. That is
 * also an override: the published source compiles a different exploit variant
 * than the payloads here - see the build-payloads.sh header.
 *
 * ksud has no source here either: it is a KernelSU late-load daemon published as
 * a versioned artifact and pinned by SHA-256 in the engine.
 */
def nativeFromSource = providers.gradleProperty('nativeFromSource')
        .map { it.toBoolean() }
        .getOrElse(false)
def compiledNativeBin = rootProject.file('../exploit/build/m3q-BP4A.251205.006/bin')
def helperSource = nativeFromSource
        ? new File(compiledNativeBin, 'su_daemon_aarch64_pie.app')
        : rootProject.file('prebuilt/helper-su_daemon_aarch64_pie.app')
def oracleSource = nativeFromSource
        ? new File(compiledNativeBin, 'slide_oracle.app.so')
        : rootProject.file('prebuilt/oracle-slide_oracle.app.so')

def ksudBin = rootProject.file('prebuilt/ksud-m3q-S948NKSS4AZG3-kdp')

/*
 * Where the three bundled payloads come from. -PpayloadDir=build/payloads
 * packages payloads compiled from source (that path is relative to android/,
 * matching the other overrides); without it the committed copies are used.
 */
def payloadDir = providers.gradleProperty('payloadDir')
        .map { rootProject.file(it) }
        .getOrElse(rootProject.file('prebuilt'))
def payloadFile = { name -> new File(payloadDir, name) }

def jniOut = file('src/main/jniLibs/arm64-v8a')

/*
 * SHA-256 of the binaries upstream validated, so that swapping one has to be a
 * deliberate act. verifyM3qNativeInputs compares the packaged file against these
 * unless the matching override above says the build is intentionally replacing
 * it; the payload hashes are the same three android/build-payloads.sh reports as
 * "upstream".
 */
def validatedHashes = [
        'libm3qroot.so'         : 'a9053c42c53cc31e0b4ceafe9e7c34acfc1020fc0d6da9500c58382c287f3f04',
        'libm3qoracle.so'       : '0ba893383321f94c594ddfac6e14711c985c8a7a7286e5ccd4e5184de882d41a',
        'libm3qpayload.so'      : 'f6158d21ea432c8b7a258bf991f87ef30367fac628fc56fffc883e0757ef28a7',
        'libm3qpayload_s936b.so': '28b739b01f4e67aed7b17bfafb27cc72c3bc1a7d9eac4d41834d99a3d10e9a28',
        'libm3qpayload_s938b.so': 'e41a2073cba1b4e5da8df19716943681dff9a8a49455f9faed48bf82909f8e20',
        'libm3qksud.so'         : '1e1cb6b861d0d4951b7374c12404eee1fb4c02a77240e0500ca571a302396374',
]
def overriddenLibs = [] as Set<String>
if (nativeFromSource) {
    overriddenLibs.addAll(['libm3qroot.so', 'libm3qoracle.so'])
}
if (providers.gradleProperty('payloadDir').isPresent()) {
    overriddenLibs.addAll(['libm3qpayload.so', 'libm3qpayload_s936b.so', 'libm3qpayload_s938b.so'])
}
def sha256Of = { File file ->
    def digest = java.security.MessageDigest.getInstance('SHA-256')
    file.withInputStream { stream ->
        byte[] buffer = new byte[8192]
        int read
        while ((read = stream.read(buffer)) > 0) {
            digest.update(buffer, 0, read)
        }
    }
    digest.digest().collect { String.format('%02x', it) }.join()
}

/*
 * The six libraries the engine loads, all from committed prebuilts, so building
 * the APK needs neither the NDK nor the exploit sources. The helper and oracle
 * used to be expected in exploit/build, which is gitignored: they were never
 * produced there, and because a Copy skips missing inputs silently the APK was
 * packaged with four of six and every root run failed at
 * M3qRootEngine.runFreshRoot() with exit 126.
 *
 * The helper and oracle are now the exact binaries upstream ships in its release
 * APK. android/build-native.sh regenerates them from exploit/ if those sources
 * change; refresh prebuilt/ afterwards.
 */
tasks.register('prepareM3qPayloads', Copy) {
    from(helperSource) {
        rename { 'libm3qroot.so' }
    }
    from(payloadFile('payload-pa1q-S931BXXUCZZI4.so')) {
        rename { 'libm3qpayload.so' }
    }
    from(payloadFile('payload-pa3q-S938BXXUCZZI4.so')) {
        rename { 'libm3qpayload_s938b.so' }
    }
    from(payloadFile('payload-pa2q-S936BXXUCZZI4.so')) {
        rename { 'libm3qpayload_s936b.so' }
    }
    from(oracleSource) {
        rename { 'libm3qoracle.so' }
    }
    from(ksudBin) {
        rename { 'libm3qksud.so' }
    }
    into(jniOut)
}

/*
 * Every native library the engine loads at runtime. The Copy task above skips
 * inputs that do not exist without complaining, which once shipped an APK with
 * no helper or oracle at all while reporting success, so verify them first.
 */
tasks.register('verifyM3qNativeInputs') {
    description = 'Fails the build when a native library the app loads is missing.'
    def required = [
            [helperSource, 'libm3qroot.so'],
            [oracleSource, 'libm3qoracle.so'],
            [payloadFile('payload-pa1q-S931BXXUCZZI4.so'), 'libm3qpayload.so'],
            [payloadFile('payload-pa2q-S936BXXUCZZI4.so'), 'libm3qpayload_s936b.so'],
            [payloadFile('payload-pa3q-S938BXXUCZZI4.so'), 'libm3qpayload_s938b.so'],
            [ksudBin, 'libm3qksud.so'],
    ]
    doLast {
        def missing = required.findAll { !it[0].isFile() }
        if (missing.isEmpty()) {
            return
        }
        def report = missing.collect { entry -> "  ${entry[1]}  <-  ${entry[0]}" }
                .join('\n')
        throw new GradleException(
                'Refusing to package an incomplete native payload set.\n' +
                        'The app loads all six of these at runtime:\n' + report + '\n' +
                        (nativeFromSource
                                ? '  (nativeFromSource is on: run android/build-native.sh first)'
                                : '  (drop -PnativeFromSource, or refresh the committed prebuilts)') +
                        '\n  (for the payloads: run android/build-payloads.sh and pass' +
                        " -PpayloadDir=build/payloads, or drop that property to use prebuilt/)")
    }

    doLast {
        def drifted = required.findAll { entry ->
            !overriddenLibs.contains(entry[1]) && sha256Of(entry[0]) != validatedHashes[entry[1]]
        }
        if (drifted.isEmpty()) {
            return
        }
        def report = drifted.collect { entry ->
            "  ${entry[1]}\n" +
                    "    packaged:  ${sha256Of(entry[0])}\n" +
                    "    validated: ${validatedHashes[entry[1]]}\n" +
                    "    from:      ${entry[0]}"
        }.join('\n')
        throw new GradleException(
                'Refusing to package a native library that is not the validated binary.\n' +
                        'These are the binaries upstream shipped and tested on hardware:\n' +
                        report + '\n' +
                        'If this is deliberate, override the set explicitly:\n' +
                        '  -PnativeFromSource=true        helper and oracle from exploit/\n' +
                        '  -PpayloadDir=build/payloads    payloads from the RMG source\n' +
                        'Note that the from-source helper does not implement the interface the\n' +
                        'engine calls, and the published payload source is a different variant.')
    }
}

android {
    namespace = 'dev.indevelopment.m3qroot'
    compileSdk {
        version = release(37)
    }

    defaultConfig {
        applicationId 'com.samsu'
        minSdk 36
        targetSdk 37
        // CI derives these from the release tag so a published APK does not
        // claim a version from months ago.
        versionCode(providers.gradleProperty('versionCode').map(Integer::parseInt).orNull ?: 25)
        versionName(providers.gradleProperty('versionName').orNull ?: '1.68')
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    /*
     * CI decodes a real keystore and points SAMSU_KEYSTORE_FILE at it, so a
     * published release is signed with a stable key. Without those variables the
     * release falls back to the debug key, which keeps local and fork builds
     * working and installable.
     */
    /*
     * SAMSU_KEYSTORE_FILE arrives absolute from CI ($RUNNER_TEMP) and relative
     * from a developer machine (android/keystore/release.jks). Resolving only
     * against the module directory made a relative path miss silently and fall
     * back to the debug key, so a "release" APK shipped signed like a test one.
     */
    def resolveKeystore = { String raw ->
        if (!raw) {
            return null
        }
        def supplied = new File(raw)
        if (supplied.isAbsolute()) {
            return supplied.isFile() ? supplied : null
        }
        return [
                new File(rootProject.projectDir.parentFile, raw),
                new File(rootProject.projectDir, raw),
                new File(project.projectDir, raw),
        ].find { it.isFile() }
    }
    /*
     * The same four settings can come from keystore/keystore.properties, which
     * android/keystore/ holds on a developer machine and .gitignore keeps out of
     * history. Without this the file sat there unread, so a local
     * assembleRelease fell back to the debug key and produced an APK that could
     * not install over a published one - "signatures do not match". CI keeps
     * using secrets: environment variables win over the file.
     */
    def keystoreProperties = new Properties()
    def keystorePropertiesFile = rootProject.file('keystore/keystore.properties')
    if (keystorePropertiesFile.isFile()) {
        keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
    }
    def signingSetting = { String envName, String propertyName ->
        System.getenv(envName) ?: keystoreProperties.getProperty(propertyName)
    }

    def keystoreFile = resolveKeystore(signingSetting('SAMSU_KEYSTORE_FILE', 'storeFile'))
    def keystorePassword = signingSetting('SAMSU_KEYSTORE_PASSWORD', 'storePassword')
    def keyAliasName = signingSetting('SAMSU_KEY_ALIAS', 'keyAlias')
    def keyPasswordValue = signingSetting('SAMSU_KEY_PASSWORD', 'keyPassword')
    def releaseKeyReady = keystoreFile != null && keystorePassword && keyAliasName && keyPasswordValue
    if (releaseKeyReady) {
        signingConfigs {
            release {
                storeFile keystoreFile
                storePassword keystorePassword
                keyAlias keyAliasName
                keyPassword keyPasswordValue
            }
        }
    } else if (keystorePropertiesFile.isFile()) {
        // The file is there but did not resolve to a usable key: say so, because
        // the alternative is shipping a debug-signed APK that looks like a release.
        logger.warn('keystore.properties was found but did not yield a usable key; ' +
                'the release APK will be signed with the debug key.')
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
            signingConfig = releaseKeyReady ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        jniLibs {
            useLegacyPackaging = true
            keepDebugSymbols += '**/*.so'
        }
    }

    lint {
        disable 'ChromeOsAbiSupport', 'ObsoleteSdkInt'
    }
}

dependencies {
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'dev.rikka.shizuku:api:13.1.5'
    implementation 'dev.rikka.shizuku:provider:13.1.5'

    // In-app Wireless ADB transport (port of Root-My-Galaxy-Extended):
    // coroutines serialise the temporary Wireless Debugging session, and
    // BouncyCastle provides the TLS 1.3 pairing handshake that Conscrypt's
    // restricted hidden APIs cannot do on Android 16+.
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.11.0'
    implementation 'org.bouncycastle:bcprov-jdk18on:1.80'
    implementation 'org.bouncycastle:bcpkix-jdk18on:1.80'
    implementation 'org.bouncycastle:bctls-jdk18on:1.80'
}

tasks.named('prepareM3qPayloads') {
    dependsOn(tasks.named('verifyM3qNativeInputs'))
}

tasks.named('preBuild') {
    dependsOn(tasks.named('prepareM3qPayloads'))
}
