plugins {
    id 'com.android.application'
}

def nativeBin = rootProject.file('../exploit/build/m3q-BP4A.251205.006/bin')
def ksudBin = rootProject.file('prebuilt/ksud-m3q-S948NKSS4AZG3-kdp')
def jniOut = file('src/main/jniLibs/arm64-v8a')

tasks.register('prepareM3qPayloads', Copy) {
    from(new File(nativeBin, 'su_daemon_aarch64_pie.app')) {
        rename { 'libm3qroot.so' }
    }
    from(rootProject.file('prebuilt/payload-pa1q-S931BXXUCZZI4.so')) {
        rename { 'libm3qpayload.so' }
    }
    from(rootProject.file('prebuilt/payload-pa3q-S938BXXUCZZI4.so')) {
        rename { 'libm3qpayload_s938b.so' }
    }
    from(rootProject.file('prebuilt/payload-pa2q-S936BXXUCZZI4.so')) {
        rename { 'libm3qpayload_s936b.so' }
    }
    from(new File(nativeBin, 'slide_oracle.app.so')) {
        rename { 'libm3qoracle.so' }
    }
    from(ksudBin) {
        rename { 'libm3qksud.so' }
    }
    into(jniOut)
}

/*
 * Every native library the engine loads at runtime. Two are compiled from
 * exploit/ and the other four are committed prebuilts. The Copy task above
 * silently skips inputs that do not exist, which once shipped an APK with no
 * helper binary at all: every root run then died at M3qRootEngine.runFreshRoot()
 * with "Required native files not found in APK." and exit 126, while
 * prepareM3qPayloads reported success.
 */
tasks.register('verifyM3qNativeInputs') {
    description = 'Fails the build when a native library the app loads is missing.'
    def required = [
            [new File(nativeBin, 'su_daemon_aarch64_pie.app'), 'libm3qroot.so', true],
            [new File(nativeBin, 'slide_oracle.app.so'), 'libm3qoracle.so', true],
            [rootProject.file('prebuilt/payload-pa1q-S931BXXUCZZI4.so'), 'libm3qpayload.so', false],
            [rootProject.file('prebuilt/payload-pa2q-S936BXXUCZZI4.so'), 'libm3qpayload_s936b.so', false],
            [rootProject.file('prebuilt/payload-pa3q-S938BXXUCZZI4.so'), 'libm3qpayload_s938b.so', false],
            [ksudBin, 'libm3qksud.so', false],
    ]
    doLast {
        def missing = required.findAll { !it[0].isFile() }
        if (missing.isEmpty()) {
            return
        }
        def report = missing.collect { entry ->
            "  ${entry[1]}  <-  ${entry[0]}" + (entry[2]
                    ? '  (compiled: run the native build)'
                    : '  (committed prebuilt)')
        }.join('\n')
        throw new GradleException(
                'Refusing to package an incomplete native payload set.\n' +
                        'The app loads all six of these at runtime:\n' + report)
    }
}

android {
    namespace = 'dev.indevelopment.m3qroot'
    compileSdk {
        version = release(37)
    }

    defaultConfig {
        applicationId 'com.samsu'
        minSdk 36
        targetSdk 37
        versionCode 25
        versionName '1.68'
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
            signingConfig = signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        jniLibs {
            useLegacyPackaging = true
            keepDebugSymbols += '**/*.so'
        }
    }

    lint {
        disable 'ChromeOsAbiSupport', 'ObsoleteSdkInt'
    }
}

dependencies {
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'dev.rikka.shizuku:api:13.1.5'
    implementation 'dev.rikka.shizuku:provider:13.1.5'

    // In-app Wireless ADB transport (port of Root-My-Galaxy-Extended):
    // coroutines serialise the temporary Wireless Debugging session, and
    // BouncyCastle provides the TLS 1.3 pairing handshake that Conscrypt's
    // restricted hidden APIs cannot do on Android 16+.
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.11.0'
    implementation 'org.bouncycastle:bcprov-jdk18on:1.80'
    implementation 'org.bouncycastle:bcpkix-jdk18on:1.80'
    implementation 'org.bouncycastle:bctls-jdk18on:1.80'
}

tasks.named('prepareM3qPayloads') {
    dependsOn(tasks.named('verifyM3qNativeInputs'))
}

tasks.named('preBuild') {
    dependsOn(tasks.named('prepareM3qPayloads'))
}
