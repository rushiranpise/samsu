name: Build APK

# Builds both APKs and attaches them to a GitHub release.
#
# All six native libraries are packaged from android/prebuilt/, which holds the
# binaries upstream validated on hardware, and android/app/build.gradle pins their
# SHA-256 so an unnoticed swap fails the build instead of reaching a phone.
#
# The from-source builds still run here, as checks rather than as inputs:
#
#   exploit/          compiles (build-native.sh), but its su_daemon does not
#                     implement the interface this app calls, and the vendored
#                     oracle source carries the S26 Ultra target
#   Root My Galaxy    compiles all three payloads (build-payloads.sh) from a
#   Payloads          different variant than the packaged ones - see below
#
# Payloads, specifically: the published source compiles the tracefs-physalias
# variant (phys-alias data addressing, 8-shot fops retries, ported for KernelSU
# 3.3.0), while the packaged binaries are the physical-p0-oracle variant
# validated with the 3.2.5 daemon the engine pins. Packaging them is a change of
# exploit route, so it stays opt-in via the payloads input.
#
# The payloads deserve the note. android/build-payloads.sh always runs, so every
# build compiles all three from the Root My Galaxy Payloads source and prints
# whether they still match the packaged binaries. They do not, today, and not
# for a toolchain reason: the published source compiles a different variant
# (tracefs/phys-alias route, ported for KernelSU 3.3.0) than the
# physical-p0-oracle binaries this app ships and upstream tested against the
# 3.2.5 daemon it pins. Packaging source builds is therefore a change of exploit
# route, so it is opt-in via the payloads input rather than the default.
#
# The step installs NDK 30.0.16138531, the compiler upstream's build scripts name,
# so the comparison is about source and not about which clang ran.
#
# Release signing uses these repository secrets. Without them the release build
# falls back to the debug key, so the workflow still produces an installable APK:
#
#   SAMSU_KEYSTORE_BASE64     base64 of a .jks / .keystore file
#   SAMSU_KEYSTORE_PASSWORD   store password
#   SAMSU_KEY_ALIAS           key alias
#   SAMSU_KEY_PASSWORD        key password

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version name for the artifacts (default: 1.68)'
        required: false
        type: string
      publish:
        # A tag push always publishes; this exists so a manual run can do the
        # same without hand-creating a tag first.
        description: 'Create a GitHub release, tagging this commit v<version>'
        required: false
        type: boolean
        default: false
      payloads:
        description: 'Which payloads to package: upstream-validated or built here from source'
        required: false
        type: choice
        options:
          - validated
          - source
        default: validated

permissions:
  contents: write

env:
  # AGP 9's release lint calls List.removeLast(), which only exists from Java 21.
  # The debug build skips that task, so a JDK 17 runner fails only on release.
  JAVA_VERSION: '21'
  KEYSTORE_B64: ${{ secrets.SAMSU_KEYSTORE_BASE64 }}

jobs:
  build:
    name: Assemble debug + release
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install SDK components and NDK
        run: |
          # sdkmanager is not on PATH on every runner image, and a missing
          # component must not fail the job: AGP downloads platforms and build
          # tools itself, and android/build-native.sh accepts any installed NDK.
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER=""
          for candidate in \
            "$(command -v sdkmanager 2>/dev/null || true)" \
            "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "$SDK_ROOT/cmdline-tools/bin/sdkmanager" \
            "$SDK_ROOT/tools/bin/sdkmanager" \
            "/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager"
          do
            if [ -n "$candidate" ] && [ -x "$candidate" ]; then
              SDKMANAGER="$candidate"
              break
            fi
          done
          if [ -z "$SDKMANAGER" ]; then
            echo "No sdkmanager found; leaving SDK setup to AGP."
            exit 0
          fi
          echo "Using $SDKMANAGER"
          (yes || true) | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --install "platform-tools" > /dev/null 2>&1 \
            || echo "platform-tools install failed"
          # android-37 is recent enough that it may only be on a preview channel.
          "$SDKMANAGER" --install "platforms;android-37" "build-tools;37.0.0" > /dev/null 2>&1 \
            || "$SDKMANAGER" --channel=3 --install "platforms;android-37" "build-tools;37.0.0" > /dev/null 2>&1 \
            || echo "android-37 not preinstalled; AGP will try to download it"
          if "$SDKMANAGER" --install "ndk;27.2.12479018" > /dev/null 2>&1; then
            echo "ANDROID_NDK_HOME=$SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"
            echo "Pinned NDK 27.2 installed."
          else
            echo "Pinned NDK unavailable; build-native.sh will pick an installed one."
          fi
          # The payloads are compiled with the exact NDK upstream's build scripts
          # name, so the binaries we ship can be compared to the ones upstream
          # validated instead of merely resembling them.
          if "$SDKMANAGER" --install "ndk;30.0.16138531" > /dev/null 2>&1; then
            echo "SAMSU_PAYLOAD_NDK=$SDK_ROOT/ndk/30.0.16138531" >> "$GITHUB_ENV"
            echo "Pinned NDK 30.0.16138531 installed for the payloads."
          else
            echo "NDK 30 unavailable; payloads will be compiled with another NDK"
            echo "and will not reproduce upstream's checksums."
            echo "SAMSU_PAYLOAD_NDK=${ANDROID_NDK_HOME:-$SDK_ROOT/ndk/27.2.12479018}" >> "$GITHUB_ENV"
          fi

      - name: Unit tests
        working-directory: android
        run: sh test-safety-policy.sh

      - name: Compile the exploit sources (build check)
        run: |
          # Kept as a check: it catches rot in exploit/ and builds the payload for
          # the ported target. Its outputs are not packaged - the app calls
          # libm3qroot.so with four arguments (--run-payload <payload> <helper>
          # <log>) while this su_daemon accepts three and exits 2 on the fourth,
          # which is how a from-source helper once shipped and failed every run.
          sh android/build-native.sh

      - name: Build the three payloads from source
        env:
          # build-payloads.sh picks up ANDROID_NDK_HOME; the payloads need the
          # NDK upstream's scripts name, not the one the helper and oracle use.
          ANDROID_NDK_HOME: ${{ env.SAMSU_PAYLOAD_NDK }}
        run: |
          # Compiled on every run, whether or not the result is packaged: the
          # comparison it prints is the only thing that would tell us the
          # published source had caught up with the binaries we ship.
          sh android/build-payloads.sh | tee payload-build.txt
          echo '### Payloads built from source' >> "$GITHUB_STEP_SUMMARY"
          sed -n '/^target /,$p' payload-build.txt >> "$GITHUB_STEP_SUMMARY" || true

      - name: Decode the release keystore
        if: env.KEYSTORE_B64 != ''
        env:
          KEYSTORE_PASSWORD: ${{ secrets.SAMSU_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SAMSU_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SAMSU_KEY_PASSWORD }}
        run: |
          set -e
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            echo "SAMSU_KEYSTORE_FILE=$RUNNER_TEMP/release.jks"
            echo "SAMSU_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "SAMSU_KEY_ALIAS=$KEY_ALIAS"
            echo "SAMSU_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"
          echo "Release builds will be signed with the repository keystore."

      - name: Resolve the version to stamp
        id: version
        run: |
          set -e
          if [ -n "${{ github.event.inputs.version }}" ]; then
            NAME="${{ github.event.inputs.version }}"
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            NAME="${GITHUB_REF_NAME#v}"
          else
            NAME="$(grep -oE "version_label\">[^<]+" android/app/src/main/res/values/strings.xml \
              | head -1 | sed 's/.*>//')"
          fi
          # A tag's name is read without its "v"; a typed-in version may carry one.
          # Normalise here so the tag, the asset names and versionName all agree
          # and a "v" is never doubled.
          NAME="${NAME#v}"
          # Offset above the historical local default (25) so a CI build always
          # outranks a locally assembled one; otherwise alternating between them
          # makes Android refuse installs as downgrades.
          CODE=$((1000 + GITHUB_RUN_NUMBER))
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"
          echo "code=${CODE}" >> "$GITHUB_OUTPUT"
          echo "Stamping versionName=${NAME} versionCode=${CODE}"

      - name: Assemble debug and release
        working-directory: android
        env:
          PAYLOADS: ${{ inputs.payloads || 'validated' }}
        run: |
          set -e
          payload_flag=''
          if [ "$PAYLOADS" = 'source' ]; then
            payload_flag='-PpayloadDir=build/payloads'
            echo "Packaging the payloads compiled from source."
          else
            echo "Packaging the upstream-validated payloads from prebuilt/."
          fi
          ./gradlew --no-daemon --stacktrace \
            :app:assembleDebug :app:assembleRelease \
            $payload_flag \
            -PversionName='${{ steps.version.outputs.name }}' \
            -PversionCode='${{ steps.version.outputs.code }}'

      - name: Verify the APKs carry the intended payloads
        working-directory: android
        env:
          PAYLOADS: ${{ inputs.payloads || 'validated' }}
        run: |
          # A packaging property can silently fall through to the wrong source -
          # exactly the class of mistake this workflow exists to catch - so
          # compare the bytes in the APK against the intended files.
          set -e
          status=0
          if [ "$PAYLOADS" = 'source' ]; then expected=build/payloads; else expected=prebuilt; fi
          echo "Expecting payloads from $expected"
          for apk in \
            app/build/outputs/apk/debug/app-debug.apk \
            app/build/outputs/apk/release/app-release.apk
          do
            echo "== $apk"
            for pair in \
              "libm3qpayload.so payload-pa1q-S931BXXUCZZI4.so" \
              "libm3qpayload_s936b.so payload-pa2q-S936BXXUCZZI4.so" \
              "libm3qpayload_s938b.so payload-pa3q-S938BXXUCZZI4.so"
            do
              lib=$(echo "$pair" | cut -d' ' -f1)
              want_file="$expected/$(echo "$pair" | cut -d' ' -f2)"
              want=$(sha256sum "$want_file" | cut -d' ' -f1)
              got=$(unzip -p "$apk" "lib/arm64-v8a/$lib" | sha256sum | cut -d' ' -f1)
              if [ "$want" = "$got" ]; then
                echo "   $lib = $(basename "$want_file")  $want"
              else
                echo "   $lib does not match $want_file"
                echo "     expected: $want"
                echo "     apk:      $got"
                status=1
              fi
            done
          done
          exit "$status"

      - name: Verify both APKs carry all six native libraries
        working-directory: android
        run: |
          set -e
          status=0
          for apk in \
            app/build/outputs/apk/debug/app-debug.apk \
            app/build/outputs/apk/release/app-release.apk
          do
            echo "== $apk"
            if [ ! -f "$apk" ]; then
              echo "   MISSING: no such APK"
              status=1
              continue
            fi
            unzip -l "$apk" | grep -E 'lib/arm64' | awk '{printf "   %9s  %s\n", $1, $4}'
            for lib in libm3qroot.so libm3qoracle.so libm3qpayload.so \
                       libm3qpayload_s936b.so libm3qpayload_s938b.so libm3qksud.so
            do
              if ! unzip -l "$apk" | grep -q "lib/arm64-v8a/$lib"; then
                echo "   MISSING: $lib"
                status=1
              fi
            done
          done
          exit "$status"

      - name: Name the artifacts
        run: |
          set -e
          mkdir -p dist
          VERSION='${{ steps.version.outputs.name }}'
          cp android/app/build/outputs/apk/debug/app-debug.apk \
             "dist/SamSU-${VERSION}-debug.apk"
          cp android/app/build/outputs/apk/release/app-release.apk \
             "dist/SamSU-${VERSION}-release.apk"
          ls -la dist

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: SamSU-debug
          path: dist/*-debug.apk
          if-no-files-found: error

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: SamSU-release
          path: dist/*-release.apk
          if-no-files-found: error

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/') || inputs.publish == true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', steps.version.outputs.name) }}
          name: SamSU ${{ steps.version.outputs.name }}
          files: |
            dist/SamSU-*-debug.apk
            dist/SamSU-*-release.apk
          generate_release_notes: true
          fail_on_unmatched_files: true
